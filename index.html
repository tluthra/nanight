<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111a29">
  <meta name="description" content="Nanight, an unofficial Nanit viewer for your Mac.">
  <title>Nanight</title>
  <link rel="icon" href="assets/nanight.png">
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111a29; color: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 28%, #202e43 0, #111a29 65%); }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid #c8d9ff; outline-offset: 6px; }
    .sky { position: absolute; inset: 0 0 auto; width: 100%; height: 850px; pointer-events: none; }
    .mobile-stars { display: none; }
    .clouds { position: absolute; top: 320px; left: 0; width: 50%; height: 480px; pointer-events: none; mask-image: linear-gradient(to right, #000 80%, transparent); }
    .clouds-right { left: auto; right: 0; mask-image: linear-gradient(to left, #000 80%, transparent); }
    .github { position: absolute; z-index: 1; top: 30px; right: 38px; display: inline-flex; align-items: center; gap: 9px; text-decoration: none; font-size: 14px; font-weight: 600; color: #c5cbd6; }
    .github:hover { color: white; }
    .github svg { width: 20px; height: 20px; }
    main { position: relative; padding: 100px 24px 64px; text-align: center; }
    .logo { position: relative; width: 120px; height: 120px; margin: 0 auto 25px; overflow: hidden; border: 5px solid #fff; border-radius: 25%; box-shadow: 0 12px 35px #0003; }
    .logo img { position: absolute; width: 114%; height: 114%; max-width: none; left: -7%; top: -5.5%; }
    h1 { font-family: ui-rounded, "Arial Rounded MT Bold", -apple-system, BlinkMacSystemFont, sans-serif; font-size: clamp(56px, 8vw, 76px); font-weight: 900; line-height: 1.08; letter-spacing: -3px; margin: 0; }
    .disclaimer { color: #aeb8c9; font-size: 14px; margin: 15px 0 29px; }
    .download { display: inline-flex; align-items: center; justify-content: center; gap: 11px; min-height: 54px; padding: 0 25px; border-radius: 12px; background: #faf9f6; color: #172030; text-decoration: none; font-size: 16px; font-weight: 650; box-shadow: 0 2px 3px #0002, inset 0 1px 0 #fff; transition: background .15s, transform .15s; }
    .download svg { width: 22px; height: 25px; }
    .download:hover { background: #e6ebf3; transform: translateY(-2px); }
    .photo { width: min(100%, 1040px); margin: 64px auto 0; border: 1px solid #ffffff65; border-radius: 20px; background: #192435; box-shadow: 0 0 24px #ffffff18, 0 0 64px #ffffff0d, 0 30px 90px #0002; overflow: hidden; }
    .photo img { display: block; width: 100%; height: auto; }
    @media (max-width: 600px) {
      .github { top: 24px; right: 24px; }
      main { padding-top: 102px; }
      .logo { width: 104px; height: 104px; }
      .photo { margin-top: 48px; border-radius: 12px; }
      .sky { display: none; height: 700px; }
      .mobile-stars { display: block; }
      .clouds { top: 355px; height: 330px; }
    }
    @media (prefers-reduced-motion: reduce) { .download { transition: none; } }
  </style>
</head>
